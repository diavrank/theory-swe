name: Deploy Staging VM

on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: Docker Hub image to deploy
        required: false
        default: diavrank/scaffold-meteor-vue
      image_tag:
        description: Docker tag to build/deploy (leave empty to auto-generate)
        required: false
        default: ""
      app_dir:
        description: Absolute app directory on VM
        required: false
        default: /opt/theory-swe

jobs:
  build-publish-image:
    name: Build and publish image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve-tag.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve-tag
        shell: bash
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="staging-${GITHUB_SHA::12}"
          fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using image tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ inputs.docker_image }}:${{ steps.resolve-tag.outputs.image_tag }}

  deploy-staging:
    name: Deploy to staging
    needs: build-publish-image
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible

      - name: Configure SSH access
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_SSH_PRIVATE_KEY: ${{ secrets.GCP_VM_SSH_PRIVATE_KEY }}
        run: |
          test -n "$GCP_VM_HOST"
          test -n "$GCP_VM_SSH_PRIVATE_KEY"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$GCP_VM_SSH_PRIVATE_KEY" > "$HOME/.ssh/gcp_vm_key"
          chmod 600 "$HOME/.ssh/gcp_vm_key"
          ssh-keyscan -H "$GCP_VM_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Write Ansible inventory
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_SSH_USER: ${{ secrets.GCP_VM_SSH_USER }}
          GCP_VM_SSH_PORT: ${{ secrets.GCP_VM_SSH_PORT }}
        run: |
          test -n "$GCP_VM_HOST"
          test -n "$GCP_VM_SSH_USER"

          PORT="${GCP_VM_SSH_PORT:-22}"
          cat > .github/ansible-inventory.ini <<EOF
          [staging]
          gcp-staging ansible_host=${GCP_VM_HOST} ansible_user=${GCP_VM_SSH_USER} ansible_port=${PORT} ansible_ssh_private_key_file=${HOME}/.ssh/gcp_vm_key
          EOF

      - name: Deploy image to staging VM
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          ansible-playbook \
            -i .github/ansible-inventory.ini \
            deploy/ansible/deploy-staging.yml \
            --extra-vars "app_dir=${{ inputs.app_dir }}" \
            --extra-vars "docker_image=${{ inputs.docker_image }}" \
            --extra-vars "docker_image_tag=${{ needs.build-publish-image.outputs.image_tag }}"
