name: Release Please

on:
  push:
    branches: [dev]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare or publish release
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
