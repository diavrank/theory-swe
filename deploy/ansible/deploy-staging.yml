---
- name: Deploy Meteor app to staging VM
  hosts: staging
  gather_facts: false
  vars:
    app_dir: /opt/theory-swe
    docker_image: diavrank/scaffold-meteor-vue
    docker_image_tag: latest
    dockerhub_username: "{{ lookup('ansible.builtin.env', 'DOCKERHUB_USERNAME') | default('', true) }}"
    dockerhub_password: "{{ lookup('ansible.builtin.env', 'DOCKERHUB_PASSWORD') | default('', true) }}"

  tasks:
    - name: Validate app directory exists
      ansible.builtin.stat:
        path: "{{ app_dir }}"
      register: app_dir_stat

    - name: Abort when app directory does not exist
      ansible.builtin.fail:
        msg: "Expected app directory {{ app_dir }} was not found on the target VM."
      when: not app_dir_stat.stat.exists

    - name: Login to Docker Hub when credentials are provided
      ansible.builtin.shell: |
        echo "{{ dockerhub_password }}" | docker login -u "{{ dockerhub_username }}" --password-stdin
      args:
        executable: /bin/bash
      when:
        - dockerhub_username | length > 0
        - dockerhub_password | length > 0
      no_log: true

    - name: Pull selected app image
      ansible.builtin.command: docker pull {{ docker_image }}:{{ docker_image_tag }}

    - name: Restart app service with updated image
      ansible.builtin.command: doppler run -- docker compose up -d --no-deps app
      args:
        chdir: "{{ app_dir }}"
      environment:
        APP_IMAGE: "{{ docker_image }}:{{ docker_image_tag }}"

    - name: Display current app service status
      ansible.builtin.command: docker compose ps app
      args:
        chdir: "{{ app_dir }}"
      register: app_service_status

    - name: Print app service status
      ansible.builtin.debug:
        var: app_service_status.stdout_lines
